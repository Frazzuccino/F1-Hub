<svg xmlns="http://www.w3.org/2000/svg" class="car-schematic car-schematic-v2" viewBox="0 0 1000 440" role="img" aria-label="Detailed Formula 1 car schematic showing 3 mapped update locations for Ferrari" style="--car-accent:#e8002d"><style>svg{background:#080808}.view-label{fill:#888;font:700 14px sans-serif}.car-body{fill:#181818;stroke:#777;stroke-width:2}.floor-shape,.floor-side{fill:#111;stroke:#555;stroke-width:2}.sidepod-shape{fill:#222;stroke:#888;stroke-width:2}.aero-surface,.rear-wing-element,.rear-wing-main,.diffuser-shape{fill:#161616;stroke:#e8002d;stroke-width:2}.endplate{fill:#111;stroke:#888;stroke-width:2}.tyre{fill:#020202;stroke:#888;stroke-width:2}.wheel-core{fill:#222;stroke:#888;stroke-width:2}.wheel-hub{fill:#555}.cockpit-shape{fill:#080808;stroke:#aaa;stroke-width:2}.halo-shape{fill:none;stroke:#bbb;stroke-width:3}.airbox,.engine-cover{fill:#181818;stroke:#777;stroke-width:2}.suspension,.nose-ridge,.floor-edge-line,.beam-wing-line{fill:none;stroke:#777;stroke-width:2}.car-highlight-line{fill:none;stroke:#e8002d;stroke-width:2;opacity:.5}.car-marker circle{fill:#e8002d;stroke:#fff;stroke-width:2}.car-marker text{fill:#fff;font:700 10px sans-serif;text-anchor:middle}</style>
