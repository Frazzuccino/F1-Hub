<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="application-name" content="F1 Hub" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#090909" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="F1 Hub" />
  <script>
    // Capture Chromium's install event as early as possible.
    window.__f1InstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__f1InstallPrompt = event;
    });
  </script>
  <title>F1 Hub</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=1.11.2" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button id="brand-btn" class="brand" aria-label="Home">
        <span class="brand-mark">F1</span><span class="brand-word">HUB</span>
      </button>
      <div class="top-actions">
        <button id="install-app-btn" class="install-top-btn hidden" aria-label="Install F1 Hub">↓ APP</button>
        <span id="connection-pill" class="pill subtle">ONLINE</span>
        <button id="refresh-btn" class="icon-btn" aria-label="Refresh">↻</button>
      </div>
    </header>

    <div id="pull-indicator" class="pull-indicator" aria-hidden="true">PULL TO REFRESH</div>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>HOME</small></button>
      <button data-route="races" class="nav-btn"><span>▦</span><small>RACES</small></button>
      <button data-route="standings" class="nav-btn"><span>🏆</span><small>STANDINGS</small></button>
      <button data-route="news" class="nav-btn"><span>◫</span><small>NEWS</small></button>
      <button data-route="more" class="nav-btn"><span>☰</span><small>MORE</small></button>
    </nav>
  </div>

  <div id="install-sheet" class="install-sheet hidden" role="dialog" aria-modal="true" aria-label="Install F1 Hub">
    <div class="install-grabber"></div>
    <div class="eyebrow">APP MODE</div>
    <div class="install-title">Install F1 Hub</div>
    <div id="install-sheet-copy" class="muted">Install F1 Hub as a standalone app with its own icon and no browser address bar.</div>
    <div class="install-actions"><button id="install-now" class="external-btn red">INSTALL</button><button id="install-later" class="external-btn">NOT NOW</button></div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=1.11.2"></script>
</body>
</html>
