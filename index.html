<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="F1 Hub" />
  <title>F1 Hub</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button id="brand-btn" class="brand" aria-label="Home">
        <span class="brand-mark">F1</span><span class="brand-word">HUB</span>
      </button>
      <div class="top-actions">
        <span id="connection-pill" class="pill subtle">ONLINE</span>
        <button id="refresh-btn" class="icon-btn" aria-label="Refresh">↻</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>HOME</small></button>
      <button data-route="races" class="nav-btn"><span>▦</span><small>RACES</small></button>
      <button data-route="standings" class="nav-btn"><span>🏆</span><small>STANDINGS</small></button>
      <button data-route="news" class="nav-btn"><span>◫</span><small>NEWS</small></button>
      <button data-route="more" class="nav-btn"><span>☰</span><small>MORE</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
